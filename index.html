<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestión de Albaranes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF-Lib para manipular PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- JSZip para descargar varios PDF con su nombre en un archivo comprimido -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    
    /* Cabeceras por chofer */
    .th-ricardo { background-color: #e0f2fe; color: #0369a1; }
    .th-elkin { background-color: #ffe4e6; color: #991b1b; }
    .th-ainhoa { background-color: #fef9c3; color: #854d0e; }
    .th-anulacion { background-color: #f1f5f9; color: #334155; }
    .th-taxi { background-color: #fae8ff; color: #86198f; }
    .th-nuevo { background-color: #f3e8ff; color: #5b21b6; }
    
    .row-unassigned { background-color: #fff1f2 !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- Encabezado Móvil -->
  <header class="bg-blue-600 text-white p-3 shadow-md flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-base font-bold">Gestión de Albaranes</h1>
    <span class="text-xs bg-blue-700 px-2 py-1 rounded">Móvil</span>
  </header>

  <!-- Navegación -->
  <nav class="bg-white shadow flex border-b text-sm">
    <button id="btn-tab1" onclick="switchTab('tab1')" class="flex-1 py-2.5 text-center tab-active transition-colors">
      🖨️ Matriz Impresión
    </button>
    <button id="btn-tab2" onclick="switchTab('tab2')" class="flex-1 py-2.5 text-center text-slate-500 transition-colors">
      ✂️ Fusión / Corrección
    </button>
  </nav>

  <!-- Contenido Principal -->
  <main class="flex-1 p-2 max-w-xl mx-auto w-full space-y-3">

    <!-- PESTAÑA 1: MATRIZ DE IMPRESIÓN -->
    <section id="tab1" class="space-y-3">
      <!-- Carga de Archivos -->
      <div class="bg-white p-3 rounded-lg shadow border border-slate-200 flex items-center gap-2">
        <input type="file" id="p1-files" accept="application/pdf" multiple class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700"/>
        <button onclick="cargarPDFsMatriz()" class="bg-slate-800 text-white px-3 py-1.5 rounded-md text-xs font-semibold shrink-0 active:scale-95 transition-transform">
          Cargar
        </button>
      </div>

      <!-- Alerta de Hojas Sin Asignar -->
      <div id="alerta-no-impresas" class="hidden bg-amber-50 border-l-4 border-amber-500 p-2.5 rounded-r-md text-xs text-amber-800">
        <p class="font-bold">⚠️ Hojas sin asignar detectadas:</p>
        <p id="texto-hojas-omitidas" class="mt-0.5 text-[11px] leading-tight"></p>
      </div>

      <!-- Matriz con Scroll Horizontal -->
      <div id="contenedor-matriz" class="hidden bg-white rounded-lg shadow border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto max-h-[55vh] overflow-y-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
              <tr class="border-b text-center text-[11px]">
                <th class="p-2 bg-slate-100 text-left min-w-[110px] sticky left-0 z-20 shadow-r">Documento / Hoja</th>
                <th class="p-2 th-ricardo min-w-[60px]">Ricardo</th>
                <th class="p-2 th-elkin min-w-[60px]">Elkin</th>
                <th class="p-2 th-ainhoa min-w-[60px]">Ainhoa</th>
                <th class="p-2 th-anulacion min-w-[65px]">Anulación</th>
                <th class="p-2 th-taxi min-w-[60px]">Taxi</th>
                <th class="p-2 th-nuevo min-w-[85px]">
                  <input type="text" id="txt-custom-global" placeholder="+ Otro" oninput="actualizarLabelCustom()" class="w-full text-center text-[10px] p-0.5 border rounded bg-white text-slate-800 focus:outline-none"/>
                </th>
              </tr>
            </thead>
            <tbody id="tbody-matriz" class="divide-y divide-slate-100">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Botón Único de Impresión -->
      <div id="p1-acciones" class="hidden space-y-2">
        <button onclick="procesarEImprimirPDFs()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
          <span>🖨️</span> Generar y Descargar Archivos por Chofer
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: FUSIÓN DE ALBARANES -->
    <section id="tab2" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-lg shadow border border-slate-200 space-y-2">
        <h2 class="font-bold text-xs text-slate-700">1. Archivo Base (Original)</h2>
        <input type="file" id="p2-base" accept="application/pdf" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700"/>
        <input type="text" id="p2-paginas-base" placeholder="Páginas a quitar (ej: 1, 3)" class="w-full p-1.5 border rounded text-xs bg-slate-50"/>
      </div>

      <div class="bg-white p-3 rounded-lg shadow border border-slate-200 space-y-2">
        <h2 class="font-bold text-xs text-slate-700">2. Archivo Corrección</h2>
        <input type="file" id="p2-reemplazo" accept="application/pdf" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700"/>
        <input type="text" id="p2-paginas-reemplazo" placeholder="Páginas a tomar (ej: 1, 2)" class="w-full p-1.5 border rounded text-xs bg-slate-50"/>
      </div>

      <button onclick="fusionarPDFs()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform">
        ⚡ Fusionar y Corregir PDF
      </button>

      <div id="p2-resultado" class="hidden text-center p-2.5 bg-green-50 rounded-lg border border-green-200">
        <p class="text-green-700 font-semibold text-xs mb-1.5">¡PDF fusionado con éxito!</p>
        <a id="p2-download" target="_blank" class="inline-block bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold shadow">Descargar / Abrir PDF</a>
      </div>
    </section>

  </main>

  <script>
    const choferesBase = [
      { id: 'ricardo', nombre: 'Ricardo' },
      { id: 'elkin', nombre: 'Elkin' },
      { id: 'ainhoa', nombre: 'Ainhoa' },
      { id: 'anulacion', nombre: 'Anulación' },
      { id: 'taxi', nombre: 'Taxi' }
    ];

    let paginasCargadas = [];

    function switchTab(tabId) {
      document.getElementById('tab1').classList.add('hidden');
      document.getElementById('tab2').classList.add('hidden');
      document.getElementById('btn-tab1').className = "flex-1 py-2.5 text-center transition-colors text-slate-500";
      document.getElementById('btn-tab2').className = "flex-1 py-2.5 text-center transition-colors text-slate-500";

      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).className = "flex-1 py-2.5 text-center tab-active transition-colors";
    }

    async function cargarPDFsMatriz() {
      const input = document.getElementById('p1-files');
      const tbody = document.getElementById('tbody-matriz');
      tbody.innerHTML = '';
      paginasCargadas = [];

      if (!input.files.length) return alert('Por favor, selecciona uno o varios archivos PDF.');

      let idGlobalPage = 0;

      for (let i = 0; i < input.files.length; i++) {
        const file = input.files[i];
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
        const totalPaginas = pdfDoc.getPageCount();

        for (let pageIdx = 0; pageIdx < totalPaginas; pageIdx++) {
          const pageObj = {
            id: idGlobalPage,
            fileName: file.name,
            pageIndex: pageIdx,
            pageNum: pageIdx + 1,
            pdfDoc: pdfDoc
          };
          paginasCargadas.push(pageObj);

          const tr = document.createElement('tr');
          tr.id = `row-page-${idGlobalPage}`;
          tr.className = "hover:bg-slate-50 transition-colors";

          let celsChoferes = choferesBase.map(c => `
            <td class="p-2 text-center">
              <input type="checkbox" onchange="verificarMatriz()" data-page-id="${idGlobalPage}" value="${c.nombre}" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-0 cursor-pointer">
            </td>
          `).join('');

          // Columna para Chofer Personalizado
          celsChoferes += `
            <td class="p-2 text-center">
              <input type="checkbox" onchange="verificarMatriz()" data-page-id="${idGlobalPage}" value="CUSTOM" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-0 cursor-pointer">
            </td>
          `;

          tr.innerHTML = `
            <td class="p-2 font-medium text-[11px] sticky left-0 bg-white shadow-r z-0 truncate max-w-[120px]">
              <span class="block font-bold text-slate-800 truncate" title="${file.name}">${file.name}</span>
              <span class="text-[10px] text-slate-500">Pág. ${pageIdx + 1}/${totalPaginas}</span>
            </td>
            ${celsChoferes}
          `;
          tbody.appendChild(tr);
          idGlobalPage++;
        }
      }

      document.getElementById('contenedor-matriz').classList.remove('hidden');
      document.getElementById('p1-acciones').classList.remove('hidden');
      verificarMatriz();
    }

    function verificarMatriz() {
      const hojasSinCheck = [];

      paginasCargadas.forEach(p => {
        const row = document.getElementById(`row-page-${p.id}`);
        const checkboxes = document.querySelectorAll(`input[data-page-id="${p.id}"]:checked`);
        
        if (checkboxes.length === 0) {
          hojasSinCheck.push(`${p.fileName} (Pág. ${p.pageNum})`);
          row.classList.add('row-unassigned');
        } else {
          row.classList.remove('row-unassigned');
        }
      });

      const alerta = document.getElementById('alerta-no-impresas');
      const textoAlerta = document.getElementById('texto-hojas-omitidas');

      if (hojasSinCheck.length > 0) {
        alerta.classList.remove('hidden');
        textoAlerta.innerHTML = `<b>${hojasSinCheck.length} hoja(s) omitida(s):</b> ` + hojasSinCheck.join(', ');
      } else {
        alerta.classList.add('hidden');
      }
    }

    // Obtener la fecha en formato DD-MM-YYYY
    function getFechaFormateada() {
      const hoy = new Date();
      const dia = String(hoy.getDate()).padStart(2, '0');
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const anio = hoy.getFullYear();
      return `${dia}-${mes}-${anio}`;
    }

    // Procesa las hojas y genera un archivo PDF por chofer nombrando como "CHOFER - FECHA.pdf"
    async function procesarEImprimirPDFs() {
      const choferesMap = new Map();
      const nombreCustom = document.getElementById('txt-custom-global').value.trim() || 'Otro';
      const fechaActual = getFechaFormateada();

      // Agrupar páginas por chofer
      for (const p of paginasCargadas) {
        const checkboxes = document.querySelectorAll(`input[data-page-id="${p.id}"]:checked`);
        
        for (const chk of checkboxes) {
          let nombreChofer = chk.value;
          if (nombreChofer === 'CUSTOM') {
            nombreChofer = nombreCustom;
          }

          if (!choferesMap.has(nombreChofer)) {
            choferesMap.set(nombreChofer, []);
          }
          choferesMap.get(nombreChofer).push(p);
        }
      }

      if (choferesMap.size === 0) {
        return alert('No hay ninguna hoja seleccionada para imprimir.');
      }

      const zip = new JSZip();
      let totalChoferesConHojas = 0;

      // Crear PDF individual por chofer
      for (const [chofer, hojas] of choferesMap.entries()) {
        if (hojas.length > 0) {
          totalChoferesConHojas++;
          const pdfDoc = await PDFLib.PDFDocument.create();

          for (const item of hojas) {
            const [paginaCopiada] = await pdfDoc.copyPages(item.pdfDoc, [item.pageIndex]);
            pdfDoc.addPage(paginaCopiada);
          }

          const pdfBytes = await pdfDoc.save();
          const fileName = `${chofer} - ${fechaActual}.pdf`;

          // Agregar al ZIP
          zip.file(fileName, pdfBytes);

          // Intentar abrir vista de impresión para dispositivos compatibles
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          const printWin = window.open(url, '_blank');
          if (printWin) printWin.focus();
        }
      }

      // Descargar ZIP con los PDFs nombrados correctamente
      const zipContent = await zip.generateAsync({ type: "blob" });
      const zipUrl = URL.createObjectURL(zipContent);
      const a = document.createElement('a');
      a.href = zipUrl;
      a.download = `Albaranes_${fechaActual}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // PESTAÑA 2: FUSIÓN Y CORRECCIÓN
    function parsearPaginas(cadena, max) {
      const paginas = new Set();
      const partes = cadena.split(',');
      partes.forEach(p => {
        p = p.trim();
        if (p.includes('-')) {
          const [inicio, fin] = p.split('-').map(Number);
          for (let i = inicio; i <= fin; i++) {
            if (i >= 1 && i <= max) paginas.add(i - 1);
          }
        } else {
          const num = Number(p);
          if (num >= 1 && num <= max) paginas.add(num - 1);
        }
      });
      return Array.from(paginas);
    }

    async function fusionarPDFs() {
      const inputBase = document.getElementById('p2-base').files[0];
      const inputReemplazo = document.getElementById('p2-reemplazo').files[0];
      const strQuitar = document.getElementById('p2-paginas-base').value;
      const strInsertar = document.getElementById('p2-paginas-reemplazo').value;

      if (!inputBase || !inputReemplazo) return alert('Selecciona ambos archivos PDF.');
      if (!strQuitar || !strInsertar) return alert('Especifica las páginas.');

      const pdfBase = await PDFLib.PDFDocument.load(await inputBase.arrayBuffer());
      const pdfReemplazo = await PDFLib.PDFDocument.load(await inputReemplazo.arrayBuffer());

      const paginasQuitar = parsearPaginas(strQuitar, pdfBase.getPageCount());
      const paginasInsertar = parsearPaginas(strInsertar, pdfReemplazo.getPageCount());

      if (paginasQuitar.length !== paginasInsertar.length) {
        return alert(`Las páginas a quitar (${paginasQuitar.length}) no coinciden con las de reemplazo (${paginasInsertar.length}).`);
      }

      const nuevoPDF = await PDFLib.PDFDocument.create();
      const totalBase = pdfBase.getPageCount();

      let ptrInsertar = 0;
      for (let i = 0; i < totalBase; i++) {
        if (paginasQuitar.includes(i)) {
          const idxReemplazo = paginasInsertar[ptrInsertar];
          const [pagCopada] = await nuevoPDF.copyPages(pdfReemplazo, [idxReemplazo]);
          nuevoPDF.addPage(pagCopada);
          ptrInsertar++;
        } else {
          const [pagBase] = await nuevoPDF.copyPages(pdfBase, [i]);
          nuevoPDF.addPage(pagBase);
        }
      }

      const pdfBytes = await nuevoPDF.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);

      const downloadBtn = document.getElementById('p2-download');
      downloadBtn.href = url;
      downloadBtn.download = `Albaran_Corregido_${getFechaFormateada()}.pdf`;
      document.getElementById('p2-resultado').classList.remove('hidden');
    }
  </script>
</body>
</html>
